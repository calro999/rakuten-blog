name: Rakuten Blog Auto Poster

on:
  schedule:
    # 毎日 午前9:00 と 午後9:00 (日本時間) に実行 (UTCでは 00:00 と 12:00)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 手動実行も可能にします

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Run Auto Poster
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_BLOG_ID: ${{ secrets.RAKUTEN_BLOG_ID }}
          RAKUTEN_BLOG_SESSION_B64: ${{ secrets.RAKUTEN_BLOG_SESSION_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 予備の各種LLMトークン（設定している場合のみ有効になります）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          python auto_poster.py

      - name: Commit and push cache update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_cache.txt || true
          git commit -m "chore: Update posted cache [skip ci]" || true
          git push || true
